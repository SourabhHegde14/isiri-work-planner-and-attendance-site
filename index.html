<style>
:root{
  --ink:#0e1a2b;--ink2:#16263d;--ink3:#233854;
  --bg:#f3f1ea;--card:#fff;--line:#e5e1d6;--line2:#efece3;--text:#16202e;--muted:#6a7487;
  --accent:#bbb72b;--accent2:#a6a21d;--accent-soft:#f6f5d4;--accent-ink:#6b6a05;--on-accent:#12180a;
  --blue:#2563d9;--blue-soft:#e7effd;--green:#18915a;--green-soft:#e2f5ea;
  --amber:#c97d06;--amber-soft:#fcf1d8;--red:#cf3636;--red-soft:#fce9e9;
  --slate:#64748b;--slate-soft:#eceff3;
  --r:14px;--sh:0 1px 2px rgba(14,26,43,.05),0 6px 20px rgba(14,26,43,.06);--sh2:0 18px 60px rgba(14,26,43,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
body.noscroll{overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em}
.mono{font-family:'JetBrains Mono',monospace}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}.row.end{justify-content:flex-end}.row.between{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:10px;font-weight:700;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--text);transition:.15s;white-space:nowrap}
.btn:hover{border-color:#cfcabb;background:#faf9f5}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 4px 14px rgba(187,183,43,.38)}
.btn.primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}.btn.dark:hover{background:var(--ink3)}
.btn.ghost{background:transparent}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}.btn.danger:hover{background:#b02b2b}
.btn.soft-danger{color:var(--red);border-color:#f3cccc;background:#fff}.btn.soft-danger:hover{background:var(--red-soft)}
.btn.sm{padding:7px 12px;font-size:12px}.btn.xs{padding:5px 10px;font-size:11.5px;border-radius:8px}
.btn.icon{padding:8px;width:36px;height:36px}
.input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:.15s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(187,183,43,.28)}
textarea.input{resize:vertical;min-height:84px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field .opt{text-transform:none;letter-spacing:0;font-weight:500;opacity:.7}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.switch-row{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin-bottom:14px;background:#fff}
.switch-row input{width:18px;height:18px;accent-color:var(--accent)}

/* ---------- avatars, chips, pills ---------- */
.av{width:var(--s,32px);height:var(--s,32px);border-radius:50%;background:var(--c);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--s,32px)*.38);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--slate-soft);color:var(--slate)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.in{background:var(--green-soft);color:var(--green)}.pill.done{background:var(--blue-soft);color:var(--blue)}
.pill.present{background:var(--green-soft);color:var(--green)}.pill.abs{background:var(--red-soft);color:var(--red)}
.pill.hol{background:var(--amber-soft);color:var(--amber)}.pill.wait{background:var(--slate-soft);color:var(--slate)}
.pill.todo{background:var(--slate-soft);color:var(--slate)}.pill.progress{background:var(--blue-soft);color:var(--blue)}.pill.completed{background:var(--green-soft);color:var(--green)}
.pill.active{background:var(--accent-soft);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--slate-soft);color:#4b5568}
.chip.proj{background:color-mix(in srgb,var(--pc) 13%,white);color:color-mix(in srgb,var(--pc) 80%,black)}
.chip.proj i{width:7px;height:7px;border-radius:50%;background:var(--pc)}
.chip.who{padding-left:3px;background:#fff;border:1px solid var(--line)}
.chip.warn{background:var(--amber-soft);color:var(--amber)}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink)}
.bar{height:7px;border-radius:99px;background:var(--line2);overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:var(--green);transition:width .4s}
.bar.accent>i{background:var(--accent)}

/* ---------- login ---------- */
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.lg-hero{background:var(--ink);color:#fff;padding:48px 56px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px}
.lg-hero::after{content:"";position:absolute;right:-140px;bottom:-140px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(187,183,43,.42),transparent 65%);pointer-events:none}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:var(--ls,44px);height:var(--ls,44px);border-radius:50%;flex:none;display:block;box-shadow:0 0 0 2px rgba(255,255,255,.14),0 8px 22px rgba(0,0,0,.35)}
.lg-hero .logo{--ls:60px}
.side .brand{gap:11px}.side .brand .logo{--ls:48px}
.side .brand small{font-size:9.5px;letter-spacing:.05em;white-space:nowrap}
.brand b{font-size:19px;letter-spacing:-.01em;display:block;line-height:1.1}.brand small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
.lg-hero h1{font-size:60px;line-height:1.02;margin:36px 0 18px;max-width:560px}
.lg-hero h1 em{color:#d6d24a}
.lg-hero p.lead{max-width:470px;opacity:.75;font-size:15.5px}
.lg-feats{display:grid;gap:12px;margin-top:34px;max-width:470px;position:relative;z-index:1}
.lg-feat{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.04);backdrop-filter:blur(4px)}
.lg-feat svg{color:#d6d24a;flex:none;margin-top:1px}.lg-feat b{display:block;font-size:13.5px}.lg-feat span{font-size:12.5px;opacity:.65}
.lg-art{position:absolute;right:36px;top:40px;opacity:.5;pointer-events:none}
.lg-foot{font-size:12px;opacity:.5;position:relative;z-index:1}
.lg-panel{display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg)}
.lg-card{width:100%;max-width:430px}
.lg-card h2{font-size:38px;margin:22px 0 4px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#e9e5d9;border-radius:12px;padding:4px;gap:4px}
.seg button{padding:10px 8px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 2px 8px rgba(14,26,43,.1)}
.alert{padding:11px 14px;border-radius:10px;font-size:13px;margin:14px 0;font-weight:500}
.alert.err{background:var(--red-soft);color:#9b2020}.alert.ok{background:var(--green-soft);color:#12683f}.alert.warn{background:var(--amber-soft);color:#8a5600}
.lg-switch{text-align:center;margin-top:18px;font-size:13px;color:var(--muted)}
.lg-switch button{color:var(--accent-ink);font-weight:800}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:#c9d3e3;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:28px 28px}
.side .brand{padding:0 8px 24px;color:#fff}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;font-weight:700;font-size:13.5px;color:#aab6ca;text-align:left;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px rgba(187,183,43,.3)}
.side-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,.1)}
.me{display:flex;align-items:center;gap:11px;margin-bottom:12px}.me b{display:block;color:#fff;font-size:13.5px}.me small{opacity:.6;font-size:11.5px}
.side-foot .btn{width:100%;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);color:#dbe3f0}.side-foot .btn:hover{background:rgba(255,255,255,.12)}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:rgba(243,241,234,.88);backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 36px;border-bottom:1px solid var(--line)}
.top h1{font-size:30px;line-height:1.1}.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.att-pill{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:700}
.att-pill i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(24,145,90,.18)}
.view{padding:28px 36px 60px;max-width:1500px}
.tabbar{display:none}

/* ---------- cards & layout ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:20px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sec-h h3{font-size:15px;font-weight:800}
.big{font-size:42px;line-height:1.05}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:18px;flex-wrap:wrap}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}
.toolbar .input{width:auto;padding:9px 12px}
.datebar{display:flex;align-items:center;gap:6px}.datebar .input{width:auto;padding:8px 10px}
.notice{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;margin-bottom:18px;background:var(--amber-soft);color:#7a4d00;font-weight:600;border:1px solid #f0dca8}
.notice.info{background:var(--blue-soft);color:#1b448f;border-color:#cddcf7}
.notice b{font-weight:800}
.empty{text-align:center;padding:54px 20px;border:1.5px dashed #d3cebf;border-radius:var(--r);background:rgba(255,255,255,.5)}
.empty h3{font-size:26px;margin-bottom:6px}.empty p{color:var(--muted);max-width:420px;margin:0 auto 16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}
.kpi{padding:18px 20px;position:relative;overflow:hidden}
.kpi .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-ink);margin-bottom:14px}
.kpi.b .ico{background:var(--blue-soft);color:var(--blue)}.kpi.g .ico{background:var(--green-soft);color:var(--green)}.kpi.a .ico{background:var(--amber-soft);color:var(--amber)}
.kpi .n{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}.kpi .n small{font-size:16px;color:var(--muted);font-weight:700}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:6px}
.cols2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}.cols2.even{grid-template-columns:1fr 1fr}
.stack{display:flex;flex-direction:column;gap:18px}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:10px;transition:.12s}
.list-row:last-child{border-bottom:none}.list-row:hover{background:#faf8f2}
.list-row .t{font-weight:700}.list-row .s{font-size:12px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:7px;height:150px;padding-top:10px}
.chart button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;cursor:pointer}
.chart .b{width:100%;border-radius:7px 7px 3px 3px;background:var(--accent);min-height:4px;transition:.2s;position:relative}
.chart button:hover .b{filter:brightness(1.1)}
.chart .b.hol{background:repeating-linear-gradient(45deg,#e8d29a,#e8d29a 4px,#f4e7c0 4px,#f4e7c0 8px)}
.chart .b.none{background:var(--line)}
.chart small{font-size:10.5px;color:var(--muted);font-weight:700}.chart .v{font-size:10.5px;font-weight:800}

/* ---------- week strip ---------- */
.week{display:flex;align-items:stretch;gap:8px;margin:6px 0 4px}
.week .btn.icon{align-self:center;flex:none}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:9px 4px 7px;border-radius:13px;background:#fff;border:1px solid var(--line);transition:.15s;position:relative;min-width:0}
.wd small{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.wd b{font-size:20px;font-weight:800;line-height:1.1}
.wd em{font-style:normal;font-size:10.5px;font-weight:800;color:var(--accent-ink);height:14px}
.wd:hover{border-color:#cfc9b8;transform:translateY(-1px)}
.wd.tod b{color:var(--accent-ink);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:3px}
.wd.hol{background:var(--amber-soft);border-color:#f0dca8}
.wd.sel{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 8px 20px rgba(14,26,43,.25)}
.wd.sel small{color:#9fb0cc}.wd.sel b{color:#fff}.wd.sel em{color:#d6d24a}

/* ---------- kanban ---------- */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:200px;transition:.15s}
.col.over{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 2px rgba(187,183,43,.4)}
.col>header{display:flex;align-items:center;gap:8px;padding:2px 4px 12px;font-size:13px}
.col>header i{width:9px;height:9px;border-radius:50%}
.col>header span{margin-left:auto;background:#fff;border:1px solid var(--line);padding:1px 9px;border-radius:99px;font-weight:800;font-size:11.5px;color:var(--muted)}
.col-body{display:flex;flex-direction:column;gap:10px}
.col-empty{padding:22px 10px;text-align:center;color:#9aa1b0;font-size:12.5px;border:1.5px dashed #ddd8c9;border-radius:12px}
.task{background:#fff;border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:12px;padding:12px 13px;cursor:pointer;transition:.15s;box-shadow:0 1px 2px rgba(14,26,43,.04)}
.task:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(14,26,43,.1)}
.task.drag{opacity:.4}
.task-h{display:flex;gap:10px;align-items:flex-start;margin-bottom:9px}
.task-h h4{font-size:14px;font-weight:700;line-height:1.35}
.task.done h4{text-decoration:line-through;color:var(--muted)}
.tick{width:22px;height:22px;border-radius:50%;border:2px solid #cdc8b9;display:flex;align-items:center;justify-content:center;color:transparent;flex:none;margin-top:1px;transition:.15s}
.tick:hover{border-color:var(--green)}.tick.on{background:var(--green);border-color:var(--green);color:#fff}
.remark{display:flex;gap:7px;margin-top:9px;font-size:12.5px;color:#4b5568;background:#f7f5ee;padding:8px 10px;border-radius:9px}
.remark svg{flex:none;margin-top:2px;color:var(--muted)}
.remark span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.task-f{margin-top:10px;display:flex;gap:6px}

/* ---------- team ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.emp{padding:18px;cursor:pointer;transition:.15s}
.emp:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.emp .hd{display:flex;gap:12px;align-items:center;margin-bottom:14px}.emp .hd b{font-size:15px;display:block}
.emp .times{display:flex;gap:18px;margin:12px 0;font-size:12px;color:var(--muted)}.emp .times b{display:block;color:var(--text);font-size:13.5px}
.emp .cnt{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.stat{padding:14px 16px}.stat small{display:block;color:var(--muted);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em}.stat b{font-size:22px;letter-spacing:-.01em}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--muted);margin-bottom:14px}.back:hover{color:var(--text)}

/* ---------- projects ---------- */
.pcard{padding:18px 18px 16px;cursor:pointer;transition:.15s;border-top:4px solid var(--pc)}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh2)}
.pcard h3{font-size:19px;line-height:1.2;margin-bottom:3px}
.pcard .meta{display:flex;gap:14px;margin-top:14px;font-size:12px;color:var(--muted);font-weight:600}.pcard .meta span{display:flex;align-items:center;gap:5px}
.seg2{display:inline-flex;background:#e9e5d9;border-radius:10px;padding:3px;gap:2px}
.seg2 button{padding:7px 14px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--muted)}.seg2 button.on{background:#fff;color:var(--text);box-shadow:0 1px 5px rgba(14,26,43,.1)}
.phead{padding:22px 24px;border-top:5px solid var(--pc);margin-bottom:16px}
.phead h2{font-size:38px;line-height:1.05}
.visit{display:flex;gap:16px;padding:16px 18px;margin-bottom:12px}
.vdate{flex:none;width:58px;text-align:center;background:var(--ink);color:#fff;border-radius:12px;padding:8px 0}
.vdate b{display:block;font-size:22px;line-height:1}.vdate small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.visit p{white-space:pre-wrap;margin-top:6px;color:#2b3445}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.cal-head h2{font-size:34px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:600;flex-wrap:wrap}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
.cal .dow{background:#f8f6ef;padding:10px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.cell{background:#fff;min-height:112px;padding:9px 10px;display:flex;flex-direction:column;gap:5px;text-align:left;align-items:stretch;transition:.12s;position:relative}
.cell:hover{background:#fbfbee;box-shadow:inset 0 0 0 2px var(--accent)}
.cell.dim{background:#faf9f5}.cell.dim .n{opacity:.35}
.cell.holiday{background:linear-gradient(180deg,#fff7e0,#fffbee)}
.cell .n{font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:space-between}
.cell.today .n span{background:var(--accent);color:var(--on-accent);width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin:-3px 0 0 -4px}
.tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;align-self:flex-start;letter-spacing:.03em}
.tag.hol{background:var(--amber);color:#fff}
.cell-note{font-size:11.5px;font-weight:600;color:#1b448f;background:var(--blue-soft);padding:3px 7px;border-radius:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.att{margin-top:auto;font-size:11.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.att .bar{flex:1;height:5px}
.att.hi{color:var(--green)}.att.mid{color:var(--amber)}.att.lo{color:var(--red)}
.att.hi .bar>i{background:var(--green)}.att.mid .bar>i{background:var(--amber)}.att.lo .bar>i{background:var(--red)}
.cell .mine{margin-top:auto;font-size:11.5px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:5px}
.cell .mine.t{color:var(--muted);font-weight:600}

/* ---------- tables ---------- */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:11px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}

/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.scrim{position:absolute;inset:0;background:rgba(10,18,30,.55);backdrop-filter:blur(3px);animation:fade .15s}
.sheet{position:relative;background:#fff;border-radius:20px;box-shadow:var(--sh2);width:100%;max-width:560px;max-height:calc(100vh - 40px);overflow:auto;padding:26px;animation:pop .18s}
.sheet.sm{max-width:440px}.sheet.wide{max-width:760px}
.sheet h3{font-size:28px;font-family:'Instrument Serif',serif;font-weight:400;margin-bottom:4px}
.sheet .x{position:absolute;right:16px;top:16px}
.sheet .sub{color:var(--muted);margin-bottom:18px}
.dlg p{color:#4b5568;margin:8px 0 22px}
.dlg h3{margin-top:2px}
.sec{margin:20px 0 8px;font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.eod{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;align-items:flex-start}
.eod input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);margin-top:2px;flex:none}
.eod .input{margin-top:8px;padding:8px 10px;font-size:13px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:14px 0 18px;font-size:13.5px}.kv dt{color:var(--muted);font-weight:700}
#toasts{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:13.5px;box-shadow:var(--sh2);animation:pop .2s;max-width:380px;display:flex;gap:10px;align-items:center}
.toast.err{background:var(--red)}.toast.ok svg{color:#4ade80}
.splash{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--muted);font-weight:700}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}

/* ---------- responsive ---------- */
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.cols2,.cols2.even{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .login{grid-template-columns:1fr}.lg-hero{padding:28px 24px;min-height:auto}.lg-hero h1{font-size:40px;margin:22px 0 10px}.lg-feats,.lg-art{display:none}.lg-foot{display:none}.lg-panel{padding:24px 18px}
  .shell{grid-template-columns:1fr}.side{display:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--ink);padding:8px 8px calc(8px + env(safe-area-inset-bottom));justify-content:space-around;box-shadow:0 -8px 30px rgba(14,26,43,.25)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;color:#8d9bb3;font-size:10.5px;font-weight:700;padding:6px 10px;border-radius:10px;flex:1}
  .tabbar button.on{color:#fff;background:rgba(255,255,255,.1)}.tabbar button.on svg{color:#d6d24a}
  .top{padding:12px 16px;flex-wrap:wrap}.top h1{font-size:24px}.top .sub{display:none}
  .view{padding:18px 14px 110px}
  .board{grid-template-columns:1fr}.big{font-size:32px}
  .kpis{gap:10px}.kpi{padding:14px}.kpi .n{font-size:26px}
  .cell{min-height:64px;padding:6px 5px}.cell-note{display:none}.cell .n{font-size:12px}.tag{font-size:9px;padding:1px 4px}.att span.tx{display:none}.cal .dow{padding:8px 2px;font-size:9.5px;letter-spacing:0}
  .wd b{font-size:16px}.wd{padding:7px 2px 5px}.week .btn.icon{display:none}
  .sheet{padding:20px;border-radius:18px}.grid2{grid-template-columns:1fr}
  .phead h2{font-size:30px}.cal-head h2{font-size:26px}
}
</style>
</head>
<body>
<div id="login" class="login"><div class="splash">Loading…</div></div>
<div id="app" class="shell" hidden>
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main class="view" id="view"></main>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div id="modal" class="modal-wrap" hidden></div>
<div id="toasts"></div>

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

async function hashPw(pw, salt) {
  const data = new TextEncoder().encode(salt + ':' + pw);
  try { if (crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } } catch (e) {}
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (const b of data) { h1 = Math.imul(h1 ^ b, 2654435761); h2 = Math.imul(h2 ^ b, 1597334677); }
  return 'x' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}

/* =====================================================================
   DATA STORE  — Firestore (shared, live)  or  localStorage (demo mode)
   Every record is one document in the "studiolog" collection, with the
   id  "<type>__<id>"  so your existing security rules keep working.
   ===================================================================== */
let S = { users: [], attendance: [], projects: [], tasks: [], visits: [], days: [] };
let M = { users: new Map(), projects: new Map(), days: new Map() };
function rebuild() {
  S = { users: [], attendance: [], projects: [], tasks: [], visits: [], days: [] };
  for (const d of Store.docs.values()) if (S[d.col]) S[d.col].push(d);
  M = { users: new Map(S.users.map(x => [x.id, x])), projects: new Map(S.projects.map(x => [x.id, x])), days: new Map(S.days.map(x => [x.date, x])) };
}
function hintFor(c) {
  c = String(c || '');
  if (/permission-denied/.test(c)) return 'Firestore refused the request. In Firebase → Firestore → Rules (for the "' + (typeof FIRESTORE_DATABASE_ID !== 'undefined' ? FIRESTORE_DATABASE_ID : '(default)') + '" database) publish rules that allow signed-in users, and make sure Anonymous sign-in is enabled.';
  if (/operation-not-allowed|admin-restricted/.test(c)) return 'Anonymous sign-in is switched off: Firebase → Authentication → Sign-in method → enable Anonymous.';
  if (/unauthorized-domain/.test(c)) return 'This website address is not approved in Firebase yet: Firebase → Authentication → Settings → Authorized domains → Add domain, and add exactly the address in your browser bar (for example your-site.netlify.app).';
  if (/api-key/.test(c)) return 'The Firebase config looks wrong — copy it again from Project settings → Your apps.';
  if (/not-found/.test(c)) return 'The database was not found — make sure FIRESTORE_DATABASE_ID matches the Database ID shown in the Firebase console.';
  if (/timeout|unavailable|Failed to fetch/.test(c)) return 'Could not reach Firebase — check the internet connection and that FIRESTORE_DATABASE_ID is correct.';
  return '';
}
const Store = {
  mode: 'local', lastErr: '', docs: new Map(), err: null, fs: null, db: null,
  key: (c, id) => `${c}__${id}`,
  async init() {
    const ok = await this.initCloud();
    if (ok) { this.mode = 'cloud'; return; }
    this.mode = 'local'; this.docs = new Map();
    try { const raw = localStorage.getItem('sl2_docs'); if (raw) this.docs = new Map(JSON.parse(raw)); } catch (e) {}
    addEventListener('storage', ev => { if (ev.key === 'sl2_docs') { try { this.docs = new Map(JSON.parse(ev.newValue || '[]')); onData(); } catch (e) {} } });
  },
  async initCloud() {
    const cfg = typeof FIREBASE_CONFIG !== 'undefined' ? FIREBASE_CONFIG : (typeof firebaseConfig !== 'undefined' ? firebaseConfig : null);
    if (!cfg || /PASTE_/.test(cfg.apiKey || '') || /PASTE_/.test(cfg.projectId || '')) { this.err = null; return false; }
    try {
      const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
      const [A, Au, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      const app = A.initializeApp(cfg);
      await Au.signInAnonymously(Au.getAuth(app));
      const dbId = (typeof FIRESTORE_DATABASE_ID === 'string' && FIRESTORE_DATABASE_ID && FIRESTORE_DATABASE_ID !== '(default)') ? FIRESTORE_DATABASE_ID : null;
      this.db = dbId ? F.getFirestore(app, dbId) : F.getFirestore(app);
      this.fs = F;
      const colRef = F.collection(this.db, 'studiolog');
      let unsub = null;
      const readOk = await new Promise(resolve => {
        let first = true;
        const timer = setTimeout(() => { if (first) { first = false; this.err = 'timeout — is the database ID right? (' + (dbId || '(default)') + ')'; try { unsub && unsub(); } catch (e) {} resolve(false); } }, 12000);
        unsub = F.onSnapshot(colRef, snap => {
          snap.docChanges().forEach(ch => { const d = ch.doc.data(); if (ch.type === 'removed') this.docs.delete(ch.doc.id); else if (d && d.col) this.docs.set(ch.doc.id, d); });
          if (first) { first = false; clearTimeout(timer); resolve(true); } else onData();
        }, err => {
          console.error('Firestore listener error', err);
          if (first) { first = false; clearTimeout(timer); this.err = err.code || err.message; try { unsub && unsub(); } catch (e) {} resolve(false); }
          else toast('Live sync problem: ' + (err.code || err.message), 'err');
        });
      });
      if (!readOk) return false;
      // prove that we can WRITE too, before anyone signs up
      try {
        await Promise.race([F.setDoc(F.doc(this.db, 'studiolog', '_ping'), { col: 'ping', t: Date.now() }), new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 9000))]);
      } catch (e) { try { unsub && unsub(); } catch (x) {} this.err = 'saving is blocked: ' + (e.code || e.message); return false; }
      return true;
    } catch (e) { console.error('Firebase init failed', e); this.err = e.code || e.message || String(e); return false; }
  },
  put(col, obj) {
    const d = JSON.parse(JSON.stringify({ ...obj, col }));
    this.docs.set(this.key(col, d.id), d);
    let p = Promise.resolve(true);
    if (this.mode === 'cloud') p = this.fs.setDoc(this.fs.doc(this.db, 'studiolog', this.key(col, d.id)), d).then(() => true).catch(e => { console.error(e); this.lastErr = e.code || e.message; toast('Could not save: ' + this.lastErr + '. ' + hintFor(this.lastErr), 'err'); return false; });
    else this.saveLocal();
    onData();
    return p;
  },
  remove(col, id) {
    this.docs.delete(this.key(col, id));
    if (this.mode === 'cloud') this.fs.deleteDoc(this.fs.doc(this.db, 'studiolog', this.key(col, id))).catch(e => { console.error(e); toast('Could not delete: ' + (e.code || e.message), 'err'); });
    else this.saveLocal();
    onData();
  },
  saveLocal() { try { localStorage.setItem('sl2_docs', JSON.stringify([...this.docs])); } catch (e) { toast('Browser storage is full or blocked.', 'err'); } }
};

  m.hidden = false; document.body.classList.add('noscroll'); setTimeout(() => { const a = m.querySelector('[autofocus]'); if (a && !m.contains(document.activeElement)) a.focus(); }, 40);
}
function closeModal(silent) {

  const m = $('#modal'); m.hidden = true; m.innerHTML = ''; document.body.classList.remove('noscroll');

function setStatus(id, st) {
  const t = S.tasks.find(x => x.id === id); if (!t || t.userId !== me.id || t.status === st) return;
  if (locked(t)) return toast('Completed tasks from earlier days are locked. Ask the principal to change it.', 'err');
  Store.put('tasks', { ...t, status: st, completedAt: st === 'done' ? Date.now() : null });
  if (st === 'done') toast('Task completed');
}
async function deleteProject(id) {
  const p = M.projects.get(id); if (!p) return;
  const n = S.tasks.filter(t => t.projectId === id).length, v = S.visits.filter(x => x.projectId === id).length;
  if (!await ask({ title: 'Delete this project?', body: `<b>${esc(p.name)}</b> is visible to everyone in the studio. Deleting it also removes its <b>${n} task${n === 1 ? '' : 's'}</b> and <b>${v} site visit${v === 1 ? '' : 's'}</b>.`, ok: 'Yes, continue', danger: true })) return;
  if (!await ask({ title: 'Are you absolutely sure?', body: `This permanently deletes <b>${esc(p.name)}</b> for <b>every employee</b> and cannot be undone.`, ok: 'Delete permanently', danger: true })) return;
  S.tasks.filter(t => t.projectId === id).forEach(t => Store.remove('tasks', t.id));
  S.visits.filter(x => x.projectId === id).forEach(x => Store.remove('visits', x.id));
  Store.remove('projects', id); ui.projId = null; ui.pEmp = 'all'; toast('Project deleted'); renderAll(false);
}
async function deleteTask(id) {
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  if (locked(t)) return toast('Completed tasks from earlier days are locked. Ask the principal to delete it.', 'err');
  if (!await ask({ title: 'Delete this task?', body: `“${esc(t.title)}” will be removed permanently.`, ok: 'Delete task', danger: true })) return;
  Store.remove('tasks', id); toast('Task deleted');
}

const ACT = {
  'lg-role'(d) { lg.role = d.v; lg.mode = 'in'; lg.notice = ''; renderLogin(); },
  'lg-mode'(d) { lg.mode = d.v; lg.notice = ''; renderLogin(); },
  nav(d) { ui.view = d.v; if (d.v === 'team') ui.teamEmp = null; if (d.v === 'projects') ui.projId = null; renderAll(false); },
  logout() { logout(); },
  'close-modal'() { closeModal(); },
  'ask-yes'() { const r = askResolve; askResolve = null; closeModal(); if (r) r(true); },
  'ask-no'() { closeModal(); },
  'new-task'(d) { openTaskForm(null, d.p); },
  'open-task'(d) { openTask(d.id); },
  tick(d) { const t = S.tasks.find(x => x.id === d.id); if (t) setStatus(d.id, t.status === 'done' ? 'progress' : 'done'); },
  move(d) { setStatus(d.id, d.to); },
  'del-task'(d) { deleteTask(d.id); },
  shift(d) { ui[d.key] = addDays(ui[d.key], +d.n); renderAll(true); },
  'pick-date'(d) { ui[d.key] = d.d; renderAll(true); },
  'open-emp'(d) { ui.teamEmp = d.id; renderAll(false); },
  'close-emp'() { ui.teamEmp = null; renderAll(false); },
  'goto-emp'(d) { closeModal(); ui.view = 'team'; ui.teamEmp = d.id; ui.teamDate = d.d || today(); renderAll(false); },
  'new-project'() { openProjectForm(); },
  'edit-project'(d) { const p = M.projects.get(d.id); if (p) openProjectForm(p); },
  'open-project'(d) { ui.view = 'projects'; ui.projId = d.id; ui.projTab = d.tab || 'tasks'; ui.pEmp = 'all'; renderAll(false); },
  'close-project'() { ui.projId = null; renderAll(false); },
  'proj-filter'(d) { ui.projFilter = d.v; renderAll(true); },
  'proj-tab'(d) { ui.projTab = d.v; renderAll(true); },
  'toggle-project'(d) { const p = M.projects.get(d.id); if (!p) return; const done = p.status === 'completed'; Store.put('projects', { ...p, status: done ? 'active' : 'completed', completedAt: done ? null : Date.now() }); toast(done ? 'Project reopened' : 'Project marked completed'); },
  'del-project'(d) { deleteProject(d.id); },
  'new-visit'(d) { openVisitForm(d.p); },
  'edit-visit'(d) { const v = S.visits.find(x => x.id === d.id); if (v) openVisitForm(v.projectId, v); },
  async 'del-visit'(d) { if (await ask({ title: 'Delete this site visit?', body: 'The visit and its remarks will be removed permanently.', ok: 'Delete', danger: true })) { Store.remove('visits', d.id); toast('Site visit deleted'); } },
  'cal-shift'(d) { const [y, m] = ui.calMonth.split('-').map(Number), n = new Date(y, m - 1 + (+d.n), 1); ui.calMonth = `${n.getFullYear()}-${pad(n.getMonth() + 1)}`; renderAll(true); },
  'cal-today'() { ui.calMonth = today().slice(0, 7); renderAll(true); },
  'open-day'(d) { if (ui.view !== 'calendar' && me.role === 'principal' && ui.view === 'dash') { /* stay on dashboard */ } openDay(d.d); },
  'plan-day'(d) { closeModal(); ui.date = d.d; ui.view = 'my'; renderAll(false); },
  'end-day'() { openEndDay(); },
  'export-day'(d) { exportDay(d.d); },
  'export-all'() { exportAll(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if (!el) return; const v = el.value;
  switch (el.dataset.change) {
    case 'set-date': if (v) { ui[el.dataset.key] = v; renderAll(true); } break;
    case 'my-proj': ui.myProj = v; renderAll(true); break;

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

/* drag & drop between columns (own tasks) */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.task[draggable=true]'); if (!c) return; dragId = c.dataset.id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); setTimeout(() => c.classList.add('drag'), 0); });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.drag,.over').forEach(x => x.classList.remove('drag', 'over')); });
document.addEventListener('dragover', e => { const c = e.target.closest && e.target.closest('.col[data-status]'); if (c && dragId) { e.preventDefault(); document.querySelectorAll('.col.over').forEach(x => x !== c && x.classList.remove('over')); c.classList.add('over'); } });
document.addEventListener('drop', e => { const c = e.target.closest && e.target.closest('.col[data-status]'); if (c && dragId) { e.preventDefault(); const id = dragId; dragId = null; setStatus(id, c.dataset.status); } });

/* =====================================================================
   FORMS
   ===================================================================== */
const FORMS = {
  async login(fd, f) {
    const role = lg.role, name = (fd.name || '').trim(), err = m => { $('#lgErr').innerHTML = `<div class="alert err">${esc(m)}</div>`; };
    const btn = $('#lgBtn'); btn.disabled = true;
    try {
      if (lg.mode === 'up') {
        if (name.length < 2) return err('Please enter your full name.');
        if (fd.pw.length < 4) return err('Password must be at least 4 characters.');
        if (fd.pw !== fd.pw2) return err('Passwords do not match.');
        if (role === 'principal' && S.users.some(u => u.role === 'principal')) return err('A principal account already exists.');
        if (S.users.some(u => u.role === role && u.name.toLowerCase() === name.toLowerCase())) return err('An account with this name already exists — try signing in.');
        const salt = uid(), u = { id: uid(), name, role, salt, pass: await hashPw(fd.pw, salt), createdAt: Date.now() };
        const saved = await Store.put('users', u);
        if (!saved) { Store.docs.delete(Store.key('users', u.id)); rebuild(); return err('Your account could not be saved to the cloud database (' + Store.lastErr + '). ' + hintFor(Store.lastErr)); }
        lg.notice = ''; await enter(u); toast('Welcome to iSiri, ' + name.split(' ')[0]);
      } else {
        const u = S.users.find(x => x.role === role && x.name.toLowerCase() === name.toLowerCase());
        if (!u) return err(`No ${role === 'principal' ? 'principal' : 'employee'} account found with that name.`);
        if (await hashPw(fd.pw, u.salt) !== u.pass) return err('Incorrect password.');
        lg.notice = ''; await enter(u);
      }
    } finally { const b = $('#lgBtn'); if (b) b.disabled = false; }
  },
  task(fd) {
    const title = fd.title.trim(); if (!title) return;
    if (fd.id) {
      const t = S.tasks.find(x => x.id === fd.id); if (!t) return closeModal();
      if (locked(t)) { closeModal(); return toast('That task is locked.', 'err'); }
      const st = fd.status || t.status;
      Store.put('tasks', { ...t, title, projectId: fd.projectId, date: fd.date, status: st, remarks: (fd.remarks || '').trim(), completedAt: st === 'done' ? (t.completedAt || Date.now()) : null });
      toast('Task updated');
    } else {
      Store.put('tasks', { id: uid(), title, projectId: fd.projectId, userId: me.id, userName: me.name, date: fd.date, status: 'todo', remarks: (fd.remarks || '').trim(), createdAt: Date.now(), completedAt: null });
      if (ui.view === 'my') ui.date = fd.date;
      toast(fd.date > today() ? 'Task scheduled for ' + fmtDate(fd.date, { day: 'numeric', month: 'short' }) : 'Task added');
    }
    ui.lastProj = fd.projectId; closeModal(); renderAll(true);
  },
  project(fd) {
    const name = fd.name.trim(); if (!name) return;
    if (S.projects.some(p => p.id !== fd.id && p.name.toLowerCase() === name.toLowerCase())) return toast('A project with that name already exists.', 'err');
    if (fd.id) {
      const old = S.projects.find(x => x.id === fd.id); if (!old) return closeModal();
      Store.put('projects', { ...old, name, client: (fd.client || '').trim(), location: (fd.location || '').trim(), notes: (fd.notes || '').trim(), editedByName: me.name, editedAt: Date.now() });
      closeModal(); toast('Project updated'); renderAll(true); return;
    }
    const p = { id: uid(), name, client: (fd.client || '').trim(), location: (fd.location || '').trim(), notes: (fd.notes || '').trim(), status: 'active', createdById: me.id, createdByName: me.name, createdAt: Date.now(), completedAt: null };
    Store.put('projects', p); ui.lastProj = p.id; closeModal(); toast('Project created');
    if (ui.view === 'projects') { ui.projId = p.id; ui.projTab = 'tasks'; ui.pEmp = 'all'; }
    renderAll(false);
  },
  visit(fd) {
    const remarks = fd.remarks.trim(); if (!remarks) return;
    const old = fd.id && S.visits.find(x => x.id === fd.id);
    Store.put('visits', { ...(old || { id: uid(), createdAt: Date.now(), byId: me.id, byName: me.name }), projectId: fd.projectId, date: fd.date, visitors: (fd.visitors || '').trim() || me.name, remarks });
    closeModal(); toast(old ? 'Site visit updated' : 'Site visit logged'); ui.projTab = 'visits'; renderAll(true);
  },
  day(fd) {
    const holiday = fd.holiday === 'on', headline = (fd.headline || '').trim(), nd = fd.newDate || fd.date;
    if (nd !== fd.date && (holiday || headline)) {
      if (dayInfo(nd)) return toast('That date already has a note. Open it and edit it instead.', 'err');
      Store.remove('days', fd.date); Store.put('days', { id: nd, date: nd, holiday, headline, updatedBy: me.name });
      toast('Moved to ' + fmtDate(nd, { day: 'numeric', month: 'short' })); openDay(nd); renderAll(true); return;
    }
    if (!holiday && !headline) { if (dayInfo(fd.date)) Store.remove('days', fd.date); toast('Day note cleared'); }
    else { Store.put('days', { id: fd.date, date: fd.date, holiday, headline, updatedBy: me.name }); toast(holiday ? 'Holiday saved' : 'Headline saved'); }
    openDay(fd.date); renderAll(true);
  },
  endday(fd) {
    const t = today(), tomorrow = addDays(t, 1), carry = fd.carry === 'on';
    S.tasks.filter(x => x.userId === me.id && x.date === t).forEach(x => {
      const checked = fd['done_' + x.id] === 'on', n = { ...x, remarks: (fd['rem_' + x.id] || '').trim() };
      if (checked) { if (x.status !== 'done') { n.status = 'done'; n.completedAt = Date.now(); } }
      else { if (x.status === 'done') { n.status = 'progress'; n.completedAt = null; } if (carry) { n.date = tomorrow; n.carriedFrom = t; } }
      Store.put('tasks', n);
    });
    const a = att(me.id, t), now = Date.now();
    Store.put('attendance', a ? { ...a, outAt: now } : { id: `${t}_${me.id}`, userId: me.id, name: me.name, date: t, inAt: now, outAt: now });
    const first = me.name.split(' ')[0]; logout(`Day logged at ${fmtTime(now)}. See you tomorrow, ${first}!`);
  }
};
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const h = FORMS[f.dataset.form]; if (h) { try { await h(Object.fromEntries(new FormData(f)), f); } catch (err) { console.error(err); toast('Something went wrong: ' + err.message, 'err'); } }
});

/* =====================================================================
   EXCEL EXPORT
   ===================================================================== */
function sheetOf(rows, widths) { const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ Note: 'No data' }]); ws['!cols'] = (widths || []).map(w => ({ wch: w })); return ws; }
const uName = id => (M.users.get(id) || {}).name || '(removed)';
const pName = id => (M.projects.get(id) || {}).name || '(deleted project)';
function exportDay(d) {
  if (typeof XLSX === 'undefined') return toast('The Excel library did not load — check your internet connection.', 'err');
  const E = emps(), t = today(), di = dayInfo(d), wb = XLSX.utils.book_new();
  const attRows = E.map(e => { const a = att(e.id, d); return { Employee: e.name, Date: d, 'Time in': a ? fmtTime(a.inAt) : '—', 'Time out': a ? (a.outAt ? fmtTime(a.outAt) : (d === t ? 'Still working' : 'Not logged')) : '—', 'Time worked': a ? hm((a.outAt || (d === t ? Date.now() : a.inAt)) - a.inAt) : '—', Status: a ? 'Present' : (di && di.holiday ? 'Holiday' : (d > t || !joined(e, d) ? '—' : 'Absent')) }; });
  XLSX.utils.book_append_sheet(wb, sheetOf(attRows, [24, 12, 12, 14, 12, 10]), 'Attendance');
  const ts = S.tasks.filter(x => x.date === d).sort((a, b) => pName(a.projectId).localeCompare(pName(b.projectId)) || uName(a.userId).localeCompare(uName(b.userId)));
  XLSX.utils.book_append_sheet(wb, sheetOf(ts.map(x => ({ Project: pName(x.projectId), Employee: uName(x.userId), Task: x.title, Status: STAT[x.status], Date: x.date, 'Completed at': x.completedAt ? fmtTime(x.completedAt) : '', Remarks: x.remarks || '' })), [26, 22, 44, 13, 12, 13, 50]), 'Tasks by project');
  const pids = [...new Set(ts.map(x => x.projectId))];
  XLSX.utils.book_append_sheet(wb, sheetOf(pids.map(id => { const a = ts.filter(x => x.projectId === id), dn = a.filter(x => x.status === 'done').length; return { Project: pName(id), 'Project status': (M.projects.get(id) || {}).status === 'completed' ? 'Completed' : 'Active', Tasks: a.length, Completed: dn, 'In progress': a.filter(x => x.status === 'progress').length, 'To do': a.filter(x => x.status === 'todo').length, 'Completion %': a.length ? Math.round(dn / a.length * 100) : 0 }; }), [26, 14, 8, 10, 12, 8, 13]), 'Project summary');
  const vs = S.visits.filter(v => v.date === d);
  if (vs.length) XLSX.utils.book_append_sheet(wb, sheetOf(vs.map(v => ({ Project: pName(v.projectId), Date: v.date, 'Visited by': v.visitors || v.byName, Remarks: v.remarks })), [26, 12, 24, 70]), 'Site visits');
  if (di) XLSX.utils.book_append_sheet(wb, sheetOf([{ Date: d, Holiday: di.holiday ? 'Yes' : 'No', Headline: di.headline || '' }], [12, 10, 50]), 'Day note');
  XLSX.writeFile(wb, `iSiri_StudioLog_${d}.xlsx`); toast('Excel downloaded for ' + fmtDate(d, { day: 'numeric', month: 'short', year: 'numeric' }));
}
function exportAll() {
  if (typeof XLSX === 'undefined') return toast('The Excel library did not load — check your internet connection.', 'err');
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheetOf(S.attendance.slice().sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name)).map(a => ({ Date: a.date, Employee: a.name, 'Time in': fmtTime(a.inAt), 'Time out': a.outAt ? fmtTime(a.outAt) : '', 'Time worked': a.outAt ? hm(a.outAt - a.inAt) : '' })), [12, 24, 12, 12, 12]), 'Attendance');
  XLSX.utils.book_append_sheet(wb, sheetOf(S.tasks.slice().sort((a, b) => a.date.localeCompare(b.date) || pName(a.projectId).localeCompare(pName(b.projectId))).map(x => ({ Date: x.date, Project: pName(x.projectId), Employee: uName(x.userId), Task: x.title, Status: STAT[x.status], Remarks: x.remarks || '' })), [12, 26, 22, 44, 13, 50]), 'Tasks');
  XLSX.utils.book_append_sheet(wb, sheetOf(S.projects.map(p => { const s = projStats(p); return { Project: p.name, Client: p.client || '', Location: p.location || '', Status: p.status === 'completed' ? 'Completed' : 'Active', Tasks: s.n, Completed: s.dn, 'Completion %': Math.round(s.pct), 'Site visits': s.v, 'Created by': p.createdByName || '' }; }), [26, 20, 20, 12, 8, 10, 13, 11, 18]), 'Projects');
  XLSX.utils.book_append_sheet(wb, sheetOf(S.visits.slice().sort((a, b) => a.date.localeCompare(b.date)).map(v => ({ Date: v.date, Project: pName(v.projectId), 'Visited by': v.visitors || v.byName, Remarks: v.remarks })), [12, 26, 24, 70]), 'Site visits');
  XLSX.utils.book_append_sheet(wb, sheetOf(S.days.slice().sort((a, b) => a.date.localeCompare(b.date)).map(d => ({ Date: d.date, Holiday: d.holiday ? 'Yes' : 'No', Headline: d.headline || '' })), [12, 10, 50]), 'Calendar notes');
  XLSX.writeFile(wb, `iSiri_StudioLog_ALL_${today()}.xlsx`); toast('Full export downloaded');
}

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot() {
  $('#fav').href = LOGO;
  try { await Store.init(); } catch (e) { console.error(e); Store.err = e.message; Store.mode = 'local'; }
  rebuild();
  const sid = localStorage.getItem('sl2_session'), u = sid && M.users.get(sid);
  if (u) await enter(u); else renderLogin();
  const syncLogoutBtn = () => { const b = $('#mLogout'); if (b) b.style.display = matchMedia('(max-width:900px)').matches ? '' : 'none'; };
  new MutationObserver(syncLogoutBtn).observe($('#top'), { childList: true }); addEventListener('resize', syncLogoutBtn);
  console.log('iSiri Studio Log started —', Store.mode === 'cloud' ? 'connected to Firestore' : 'DEMO mode (local storage)' + (Store.err ? ' · reason: ' + Store.err : ''));
})();
</script>
